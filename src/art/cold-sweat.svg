<svg class="art art--coldsweat" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="White wireframe geometry receding into black, cut by a rainbow prism beam, with small glowing orbs">
  <defs>
    <linearGradient id="cs-beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2fb0"/>
      <stop offset="18%" stop-color="#ff3b3b"/>
      <stop offset="36%" stop-color="#ffd93b"/>
      <stop offset="54%" stop-color="#4dff88"/>
      <stop offset="72%" stop-color="#4de2ff"/>
      <stop offset="88%" stop-color="#5c6bff"/>
      <stop offset="100%" stop-color="#ff5ce0"/>
    </linearGradient>
    <radialGradient id="cs-haze" cx="50%" cy="46%" r="56%">
      <stop offset="0%" stop-color="#2a4a72" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#2a4a72" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cs-vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070d" stop-opacity="0.8"/>
      <stop offset="42%" stop-color="#05070d" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="cs-soft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="cs-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#05070d"/>
  <rect width="1600" height="900" fill="url(#cs-haze)"/>

  <!-- Wireframe lattice: stacked rectangles in perspective, upper band -->
  <g stroke="#dceaff" fill="none" opacity="0.7">
    <g transform="translate(210 148) rotate(-24)">
      <rect x="-150" y="-92" width="300" height="184" stroke-width="2"/>
      <rect x="-136" y="-82" width="272" height="164" stroke-width="1.4" opacity="0.75"/>
      <rect x="-122" y="-72" width="244" height="144" stroke-width="1.2" opacity="0.55"/>
      <rect x="-108" y="-62" width="216" height="124" stroke-width="1" opacity="0.4"/>
      <path d="M-52 44 L0 -46 L52 44 Z" fill="#eef5ff" stroke="none" opacity="0.92"/>
    </g>
    <g transform="translate(600 96) rotate(-14)">
      <rect x="-160" y="-96" width="320" height="192" stroke-width="2"/>
      <rect x="-146" y="-86" width="292" height="172" stroke-width="1.4" opacity="0.72"/>
      <rect x="-132" y="-76" width="264" height="152" stroke-width="1.2" opacity="0.52"/>
      <path d="M-56 46 L0 -50 L56 46 Z" fill="#eef5ff" stroke="none" opacity="0.95"/>
    </g>
    <g transform="translate(1030 130) rotate(-30)">
      <rect x="-140" y="-86" width="280" height="172" stroke-width="1.8"/>
      <rect x="-126" y="-76" width="252" height="152" stroke-width="1.3" opacity="0.7"/>
      <rect x="-112" y="-66" width="224" height="132" stroke-width="1.1" opacity="0.48"/>
      <path d="M-48 40 L0 -42 L48 40 Z" fill="#eef5ff" stroke="none" opacity="0.85"/>
    </g>
    <g transform="translate(1430 176) rotate(-18)" opacity="0.7">
      <rect x="-130" y="-80" width="260" height="160" stroke-width="1.6"/>
      <rect x="-116" y="-70" width="232" height="140" stroke-width="1.2" opacity="0.6"/>
      <path d="M-44 36 L0 -38 L44 36 Z" fill="#eef5ff" stroke="none" opacity="0.8"/>
    </g>
  </g>

  <!-- Lower band, mirrored -->
  <g stroke="#dceaff" fill="none" opacity="0.66">
    <g transform="translate(300 740) rotate(14)">
      <rect x="-158" y="-98" width="316" height="196" stroke-width="2"/>
      <rect x="-144" y="-88" width="288" height="176" stroke-width="1.4" opacity="0.72"/>
      <rect x="-130" y="-78" width="260" height="156" stroke-width="1.2" opacity="0.5"/>
      <path d="M-54 -46 L0 48 L54 -46 Z" fill="#eef5ff" stroke="none" opacity="0.9"/>
    </g>
    <g transform="translate(760 800) rotate(8)">
      <rect x="-150" y="-92" width="300" height="184" stroke-width="1.9"/>
      <rect x="-136" y="-82" width="272" height="164" stroke-width="1.3" opacity="0.68"/>
      <path d="M-50 -42 L0 44 L50 -42 Z" fill="#eef5ff" stroke="none" opacity="0.88"/>
    </g>
    <g transform="translate(1230 756) rotate(20)">
      <rect x="-146" y="-90" width="292" height="180" stroke-width="1.8"/>
      <rect x="-132" y="-80" width="264" height="160" stroke-width="1.3" opacity="0.66"/>
      <rect x="-118" y="-70" width="236" height="140" stroke-width="1.1" opacity="0.46"/>
      <path d="M-48 -40 L0 44 L48 -40 Z" fill="#eef5ff" stroke="none" opacity="0.86"/>
    </g>
  </g>

  <!-- The prism beam -->
  <g>
    <path d="M126 900 L470 176 L516 196 L172 900 Z" fill="url(#cs-beam)" opacity="0.92"/>
    <path d="M126 900 L470 176 L516 196 L172 900 Z" fill="url(#cs-beam)" opacity="0.5" filter="url(#cs-soft)"/>
    <path d="M470 176 L516 196 L500 148 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Small ringed orbs, from the level itself -->
  <g>
    <g transform="translate(1132 452)">
      <circle r="26" fill="#4de2ff" opacity="0.2"/>
      <circle r="13" fill="#4de2ff" opacity="0.55"/>
      <circle r="6" fill="#eaffff"/>
      <ellipse rx="34" ry="11" fill="none" stroke="#4de2ff" stroke-width="2.6" opacity="0.85"/>
      <g fill="#4de2ff" opacity="0.8">
        <rect x="-44" y="-6" width="8" height="8"/><rect x="36" y="2" width="7" height="7"/>
        <rect x="-16" y="26" width="6" height="6"/><rect x="14" y="-30" width="6" height="6"/>
      </g>
    </g>
    <g transform="translate(392 384)">
      <circle r="22" fill="#ff5ce0" opacity="0.2"/>
      <circle r="11" fill="#ff5ce0" opacity="0.55"/>
      <circle r="5" fill="#ffeaff"/>
      <ellipse rx="30" ry="10" fill="none" stroke="#ffd93b" stroke-width="2.4" opacity="0.85"/>
      <g fill="#ff5ce0" opacity="0.8">
        <rect x="-38" y="4" width="7" height="7"/><rect x="30" y="-8" width="6" height="6"/>
        <rect x="-6" y="-26" width="5" height="5"/>
      </g>
    </g>
    <g transform="translate(1394 560)" opacity="0.8">
      <circle r="18" fill="#ffd93b" opacity="0.18"/>
      <circle r="9" fill="#ffd93b" opacity="0.5"/>
      <circle r="4" fill="#fffbe6"/>
      <ellipse rx="26" ry="9" fill="none" stroke="#4de2ff" stroke-width="2.2" opacity="0.8"/>
    </g>
  </g>

  <!-- Scanlines -->
  <g fill="#dceaff" opacity="0.10">
    <rect y="60" width="1600" height="2"/><rect y="150" width="1600" height="1"/>
    <rect y="238" width="1600" height="2"/><rect y="326" width="1600" height="1"/>
    <rect y="414" width="1600" height="2"/><rect y="502" width="1600" height="1"/>
    <rect y="590" width="1600" height="2"/><rect y="678" width="1600" height="1"/>
    <rect y="766" width="1600" height="2"/><rect y="854" width="1600" height="1"/>
  </g>
  <g fill="#4de2ff" opacity="0.22">
    <rect y="300" width="1600" height="1"/>
    <rect y="612" width="1600" height="1"/>
  </g>

  <rect width="1600" height="900" fill="url(#cs-vig)"/>
  <rect width="1600" height="900" filter="url(#cs-grain)" opacity="0.13"/>
</svg>
