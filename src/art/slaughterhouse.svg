<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Background Hell Gradient -->
    <radialGradient id="hellGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3d0000" />
      <stop offset="60%" stop-color="#140000" />
      <stop offset="100%" stop-color="#050000" />
    </radialGradient>

    <!-- Intense Red Glow Filter for Elements -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="trailGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Red/Black Background -->
  <rect width="1200" height="600" fill="url(#hellGlow)" />

  <!-- Background Layer Spikes (Parallax effect) -->
  <path d="M0,0 L0,220 L150,140 L280,260 L420,120 L580,250 L750,110 L890,270 L1050,130 L1200,240 L1200,0 Z" fill="#080000" opacity="0.6" />
  <path d="M0,600 L0,380 L180,470 L320,350 L480,490 L650,340 L820,480 L960,350 L1100,470 L1200,360 L1200,600 Z" fill="#080000" opacity="0.6" />

  <!-- Foreground Tight Structural Spikes (The Corridor) -->
  <path d="M0,0 L0,280 L60,210 L120,290 L180,220 L240,295 L300,230 L360,300 L420,235 L480,305 L540,240 L600,310 L660,235 L720,305 L780,230 L840,295 L900,220 L960,290 L1020,210 L1080,285 L1140,205 L1200,280 L1200,0 Z" fill="#000000" />
  <path d="M0,600 L0,320 L60,390 L120,310 L180,380 L240,305 L300,370 L360,300 L420,365 L480,295 L540,360 L600,290 L660,365 L720,295 L780,370 L840,305 L900,380 L960,310 L1020,390 L1080,315 L1140,395 L1200,320 L1200,600 Z" fill="#000000" />

  <!-- Red Spike Outlines (Simulating the level's object borders) -->
  <path d="M0,280 L60,210 L120,290 L180,220 L240,295 L300,230 L360,300 L420,235 L480,305 L540,240 L600,310 L660,235 L720,305 L780,230 L840,295 L900,220 L960,290 L1020,210 L1080,285 L1140,205 L1200,280" fill="none" stroke="#ff0000" stroke-width="2" opacity="0.4" filter="url(#trailGlow)" />
  <path d="M0,320 L60,390 L120,310 L180,380 L240,305 L300,370 L360,300 L420,365 L480,295 L540,360 L600,290 L660,365 L720,295 L780,370 L840,305 L900,380 L960,310 L1020,390 L1080,315 L1140,395 L1200,320" fill="none" stroke="#ff0000" stroke-width="2" opacity="0.4" filter="url(#trailGlow)" />

  <!-- Iconic Red and Black Jump Orb -->
  <g transform="translate(850, 300)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="22" fill="#000000" stroke="#ff0000" stroke-width="4" />
    <circle cx="0" cy="0" r="12" fill="#ff0000" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Secondary Black/Red Orb (Mini) -->
  <g transform="translate(1050, 350)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="16" fill="#000000" stroke="#ff0000" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#ff0000" />
  </g>

  <!-- Player Wave Trail (Zig-Zag) -->
  <polyline points="-50,300 40,250 120,350 200,260 280,340 360,270 440,330 520,280 600,300" fill="none" stroke="#ff1a1a" stroke-width="4" filter="url(#trailGlow)" opacity="0.8" />

  <!-- Player Wave Dart Icon -->
  <g transform="translate(600, 300) rotate(20)" filter="url(#neonGlow)">
    <polygon points="0,-12 30,0 0,12 8,0" fill="#ffffff" />
    <polygon points="2,-8 22,0 2,8 6,0" fill="#ff0000" />
  </g>
  
  <!-- Floating Atmospheric Blood Particles -->
  <circle cx="300" cy="280" r="2" fill="#ff0000" filter="url(#neonGlow)" />
  <circle cx="450" cy="310" r="3" fill="#ff0000" filter="url(#neonGlow)" />
  <circle cx="700" cy="270" r="1.5" fill="#ff0000" filter="url(#neonGlow)" />
</svg>
