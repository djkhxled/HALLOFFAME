<svg class="art art--deimos" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A ruined gothic castle silhouetted against a burning red eclipse, above blackened cliffs">
  <defs>
    <radialGradient id="dm-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a55"/>
      <stop offset="34%" stop-color="#ff2f21"/>
      <stop offset="72%" stop-color="#b8130f"/>
      <stop offset="93%" stop-color="#ff4a2a"/>
      <stop offset="100%" stop-color="#5c0705"/>
    </radialGradient>
    <radialGradient id="dm-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2f21" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#c4140f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#c4140f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dm-fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0506" stop-opacity="0"/>
      <stop offset="62%" stop-color="#0a0506" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a0506" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="dm-keep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0f10"/>
      <stop offset="55%" stop-color="#150809"/>
      <stop offset="100%" stop-color="#0a0506"/>
    </linearGradient>
    <filter id="dm-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0a0506"/>

  <!-- The eclipse, high and right so the title never buries it -->
  <circle cx="1090" cy="236" r="440" fill="url(#dm-halo)"/>
  <circle cx="1090" cy="236" r="206" fill="url(#dm-orb)"/>

  <!-- Lightning across the disc -->
  <g stroke="#ffd9c2" fill="none" stroke-width="2.2" opacity="0.9">
    <path d="M946 138 l26 34 -20 12 30 40"/>
    <path d="M1256 184 l-28 30 22 14 -26 42"/>
    <path d="M1198 96 l18 26 -16 10 22 30"/>
  </g>
  <g stroke="#ff5a3a" fill="none" stroke-width="6" opacity="0.3">
    <path d="M946 138 l26 34 -20 12 30 40"/>
    <path d="M1256 184 l-28 30 22 14 -26 42"/>
  </g>

  <!-- Ruined keep. Spires break into the disc so the silhouette reads. -->
  <g fill="url(#dm-keep)">
    <path d="M932 900 V286 l22-34 22 34 v58 h38 V214 l26-42 26 42 v130 h34 V150 l30-46 30 46 v194 h32 V236 l26-40 26 40 v108 h40 V300 l22-34 22 34 v600 Z"/>
    <path d="M858 900 V366 l28-40 28 40 v534 Z"/>
    <path d="M1268 900 V330 l26-38 26 38 v570 Z"/>
  </g>
  <!-- Rim light where the disc burns behind the stone -->
  <g fill="none" stroke="#ff7a52" stroke-width="2" opacity="0.6">
    <path d="M932 286 l22-34 22 34 v58 h38 V214 l26-42 26 42 v130 h34 V150 l30-46 30 46 v194 h32 V236 l26-40 26 40 v108 h40 V300 l22-34 22 34"/>
    <path d="M858 366 l28-40 28 40"/>
    <path d="M1268 330 l26-38 26 38"/>
  </g>
  <!-- Lit windows -->
  <g fill="#ff8b5e" opacity="0.8">
    <rect x="1014" y="392" width="7" height="17" rx="3.5"/>
    <rect x="1094" y="330" width="7" height="17" rx="3.5"/>
    <rect x="1160" y="410" width="7" height="17" rx="3.5"/>
    <rect x="1052" y="486" width="7" height="17" rx="3.5"/>
    <rect x="1134" y="530" width="7" height="17" rx="3.5"/>
    <rect x="946" y="452" width="7" height="17" rx="3.5"/>
  </g>

  <!-- Bats -->
  <g fill="#0a0506" opacity="0.92">
    <path d="M1176 156 q8-9 16 0 q8-9 16 0 q-8 7-16 3 q-8 4-16-3Z"/>
    <path d="M990 202 q6-7 12 0 q6-7 12 0 q-6 5-12 2 q-6 3-12-2Z"/>
    <path d="M1230 288 q7-8 14 0 q7-8 14 0 q-7 6-14 3 q-7 3-14-3Z"/>
    <path d="M918 108 q5-6 10 0 q5-6 10 0 q-5 4-10 2 q-5 2-10-2Z"/>
  </g>

  <!-- Blackened cliffs -->
  <g fill="#150c0d">
    <path d="M0 900 V642 l108-52 96 66 84-40 122 88 96-44 130 96 V900Z"/>
    <path d="M1600 900 V596 l-118 62 -92-44 -126 96 -78-36 -142 108 V900Z"/>
  </g>
  <g fill="#231314">
    <path d="M0 900 V760 l150-58 132 74 118-46 156 92 V900Z"/>
    <path d="M1600 900 V726 l-140 66 -128-52 -150 104 V900Z"/>
  </g>
  <!-- Ember light spilling between the rocks -->
  <g fill="#ff3b1e" opacity="0.4">
    <ellipse cx="470" cy="742" rx="160" ry="17"/>
    <ellipse cx="1160" cy="782" rx="140" ry="14"/>
    <ellipse cx="820" cy="812" rx="180" ry="12"/>
  </g>

  <!-- Leaning grave marker and bone, lower left -->
  <g fill="#1d1112">
    <path d="M232 900 L268 618 l34 5 -34 277 Z"/>
    <path d="M186 664 l150 21 -5 32 -150-21 Z"/>
  </g>
  <g fill="none" stroke="#c8705a" stroke-width="1.8" opacity="0.6">
    <path d="M268 618 l34 5"/>
    <path d="M186 664 l150 21"/>
  </g>
  <g fill="#2b1c1c" opacity="0.95">
    <circle cx="150" cy="836" r="26"/>
    <circle cx="206" cy="856" r="21"/>
    <circle cx="98" cy="864" r="19"/>
  </g>
  <g fill="#0a0506">
    <circle cx="142" cy="830" r="6"/><circle cx="160" cy="832" r="6"/>
    <circle cx="200" cy="852" r="5"/><circle cx="213" cy="853" r="5"/>
  </g>

  <rect width="1600" height="900" fill="url(#dm-fog)"/>
  <rect width="1600" height="900" filter="url(#dm-grain)" opacity="0.16"/>
</svg>
