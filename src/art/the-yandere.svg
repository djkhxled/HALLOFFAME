<svg class="art art--yandere" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ghost clock faces, hanging chains and gears behind a torn red paint swash on black">
  <defs>
    <radialGradient id="yd-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1636" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#c0091f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c0091f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yd-swash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0091f"/>
      <stop offset="22%" stop-color="#ff1636"/>
      <stop offset="70%" stop-color="#ff1636"/>
      <stop offset="100%" stop-color="#8e0517"/>
    </linearGradient>
    <linearGradient id="yd-vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0304" stop-opacity="0.85"/>
      <stop offset="34%" stop-color="#0a0304" stop-opacity="0.1"/>
      <stop offset="72%" stop-color="#0a0304" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0304" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="yd-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0a0304"/>
  <ellipse cx="800" cy="430" rx="760" ry="380" fill="url(#yd-glow)"/>

  <!-- Ghost clock faces, turning behind everything -->
  <g stroke="#ff1636" fill="none" opacity="0.30">
    <g transform="translate(300 250)">
      <circle r="230" stroke-width="4"/>
      <circle r="196" stroke-width="1.6"/>
      <g stroke-width="7">
        <path d="M0 -178 v26"/><path d="M0 178 v-26"/>
        <path d="M-178 0 h26"/><path d="M178 0 h-26"/>
      </g>
      <g stroke-width="4" opacity="0.8">
        <path d="M89 -154 l13 -22"/><path d="M154 -89 l22 -13"/>
        <path d="M154 89 l22 13"/><path d="M89 154 l13 22"/>
        <path d="M-89 154 l-13 22"/><path d="M-154 89 l-22 13"/>
        <path d="M-154 -89 l-22 -13"/><path d="M-89 -154 l-13 -22"/>
      </g>
      <path d="M0 0 L112 -78" stroke-width="11" stroke-linecap="round"/>
      <path d="M0 0 L-54 116" stroke-width="8" stroke-linecap="round"/>
      <circle r="15" fill="#ff1636" stroke="none"/>
    </g>
    <g transform="translate(150 760)" opacity="0.7">
      <circle r="180" stroke-width="3.4"/>
      <circle r="152" stroke-width="1.4"/>
      <path d="M0 0 L-96 -74" stroke-width="9" stroke-linecap="round"/>
      <path d="M0 0 L64 92" stroke-width="7" stroke-linecap="round"/>
      <circle r="11" fill="#ff1636" stroke="none"/>
    </g>
    <g transform="translate(1410 690)" opacity="0.55">
      <circle r="200" stroke-width="3"/>
      <path d="M0 0 L84 -104" stroke-width="8" stroke-linecap="round"/>
      <circle r="10" fill="#ff1636" stroke="none"/>
    </g>
  </g>

  <!-- Chains hanging from the top -->
  <g stroke="#ff1636" fill="none" stroke-width="7" opacity="0.62">
    <g transform="translate(662 0)">
      <ellipse cy="24" rx="15" ry="24"/><ellipse cy="72" rx="15" ry="24"/>
      <ellipse cy="120" rx="15" ry="24"/><ellipse cy="168" rx="15" ry="24"/>
      <ellipse cy="216" rx="15" ry="24"/><ellipse cy="264" rx="15" ry="24"/>
    </g>
    <g transform="translate(1088 0)" opacity="0.7">
      <ellipse cy="24" rx="13" ry="21"/><ellipse cy="66" rx="13" ry="21"/>
      <ellipse cy="108" rx="13" ry="21"/><ellipse cy="150" rx="13" ry="21"/>
    </g>
    <g transform="translate(474 0)" opacity="0.5">
      <ellipse cy="20" rx="11" ry="18"/><ellipse cy="56" rx="11" ry="18"/>
      <ellipse cy="92" rx="11" ry="18"/>
    </g>
  </g>

  <!-- Gears -->
  <g fill="none" stroke="#ff1636" opacity="0.34">
    <g transform="translate(612 116)">
      <circle r="42" stroke-width="12"/>
      <circle r="17" stroke-width="7"/>
      <g stroke-width="11">
        <path d="M0 -56 v14"/><path d="M0 56 v-14"/><path d="M-56 0 h14"/><path d="M56 0 h-14"/>
        <path d="M40 -40 l10 -10"/><path d="M-40 40 l-10 10"/>
        <path d="M40 40 l10 10"/><path d="M-40 -40 l-10 -10"/>
      </g>
    </g>
    <g transform="translate(1256 812)" opacity="0.8">
      <circle r="54" stroke-width="14"/>
      <circle r="21" stroke-width="8"/>
      <g stroke-width="13">
        <path d="M0 -70 v16"/><path d="M0 70 v-16"/><path d="M-70 0 h16"/><path d="M70 0 h-16"/>
        <path d="M50 -50 l12 -12"/><path d="M-50 50 l-12 12"/>
      </g>
    </g>
  </g>

  <!-- Black spike drips from the ceiling -->
  <g fill="#0a0304">
    <path d="M760 0 h330 v96 l-30 62 -26 -48 -34 74 -30 -58 -36 92 -32 -66 -28 44 -34 -80 -30 52 -20 -40 Z"/>
    <path d="M1180 0 h280 v70 l-26 54 -30 -44 -28 66 -34 -58 -30 48 -26 -60 -32 40 -24 -50 Z"/>
    <path d="M0 0 h210 v54 l-24 44 -26 -36 -30 58 -28 -50 -24 40 -26 -46 -22 34 Z"/>
  </g>

  <!-- The torn paint swash -->
  <g>
    <path fill="url(#yd-swash)" d="M104 340
      l86 -22 92 16 108 -26 96 20 120 -18 104 22 112 -16 96 24 108 -20 92 18 84 -14
      l24 236 -78 26 -102 -20 -96 24 -118 -18 -104 22 -110 -16 -98 20 -122 -22 -100 18
      -92 -24 -74 20 Z"/>
    <!-- torn edge fragments, top and bottom -->
    <g fill="#ff1636" opacity="0.85">
      <path d="M212 320 l52 -12 -6 22 -50 10 Z"/>
      <path d="M540 308 l64 -14 -8 24 -60 12 Z"/>
      <path d="M900 300 l74 -14 -8 24 -70 12 Z"/>
      <path d="M1240 314 l58 -12 -6 22 -56 10 Z"/>
      <path d="M280 604 l60 14 -8 24 -56 -12 Z"/>
      <path d="M700 616 l78 16 -10 26 -72 -14 Z"/>
      <path d="M1080 606 l66 14 -8 24 -62 -12 Z"/>
    </g>
    <!-- brush streaks trailing right -->
    <g fill="#ff1636" opacity="0.55">
      <rect x="1420" y="384" width="180" height="9"/>
      <rect x="1440" y="418" width="150" height="6"/>
      <rect x="1400" y="470" width="200" height="11"/>
      <rect x="1466" y="516" width="128" height="6"/>
      <rect x="1414" y="556" width="176" height="8"/>
    </g>
    <g fill="#ff1636" opacity="0.5">
      <rect x="0" y="400" width="150" height="8"/>
      <rect x="0" y="452" width="110" height="6"/>
      <rect x="0" y="520" width="168" height="10"/>
    </g>
  </g>

  <!-- Two pink eyes in the swash -->
  <g>
    <circle cx="806" cy="404" r="13" fill="#ff4d8f"/>
    <circle cx="806" cy="404" r="26" fill="#ff4d8f" opacity="0.28"/>
    <circle cx="812" cy="470" r="11" fill="#ff4d8f"/>
    <circle cx="812" cy="470" r="23" fill="#ff4d8f" opacity="0.24"/>
  </g>

  <!-- Small skull mark -->
  <g transform="translate(1332 786)" fill="#ff1636" opacity="0.85">
    <path d="M0 -18 a20 20 0 0 1 36 10 q1 14 -9 17 l0 9 -6 0 -1 -7 -5 0 -1 7 -6 0 -1 -7 -5 0 -1 7 -6 0 0 -10 q-8 -6 -5 -19 Z"/>
    <circle cx="9" cy="-6" r="5" fill="#0a0304"/>
    <circle cx="25" cy="-6" r="5" fill="#0a0304"/>
  </g>

  <rect width="1600" height="900" fill="url(#yd-vig)"/>
  <rect width="1600" height="900" filter="url(#yd-grain)" opacity="0.16"/>
</svg>
