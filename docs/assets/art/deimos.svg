<svg class="art art--deimos" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A gothic castle on a floating island silhouetted against a burning red eclipse, with broken rock islands below and a leaning grave marker among skulls">
  <defs>
    <radialGradient id="dm-orb" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#ff9d78"/>
      <stop offset="26%" stop-color="#ff5c3a"/>
      <stop offset="58%" stop-color="#e5220f"/>
      <stop offset="86%" stop-color="#a10f08"/>
      <stop offset="96%" stop-color="#ff6a3a"/>
      <stop offset="100%" stop-color="#400503"/>
    </radialGradient>
    <radialGradient id="dm-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2f21" stop-opacity="0.46"/>
      <stop offset="38%" stop-color="#c4140f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c4140f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dm-rock" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#3a1c1b"/>
      <stop offset="30%" stop-color="#1e0f10"/>
      <stop offset="100%" stop-color="#080405"/>
    </linearGradient>
    <linearGradient id="dm-rock-dark" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#241214"/>
      <stop offset="100%" stop-color="#060304"/>
    </linearGradient>
    <linearGradient id="dm-keep" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a2320"/>
      <stop offset="45%" stop-color="#261213"/>
      <stop offset="100%" stop-color="#0d0708"/>
    </linearGradient>
    <linearGradient id="dm-wood" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#33191a"/>
      <stop offset="60%" stop-color="#1b0e0f"/>
      <stop offset="100%" stop-color="#0d0708"/>
    </linearGradient>
    <radialGradient id="dm-rose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd0a8"/>
      <stop offset="55%" stop-color="#ff6a36"/>
      <stop offset="100%" stop-color="#8c1c0a"/>
    </radialGradient>
    <radialGradient id="dm-vig" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#0a0506" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="dm-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <filter id="dm-blur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="dm-soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1600" height="900" fill="#0a0506"/>

  <!-- Smoke banks -->
  <g fill="#2c1214" opacity="0.6" filter="url(#dm-blur)">
    <ellipse cx="1180" cy="90" rx="440" ry="66"/>
    <ellipse cx="700" cy="210" rx="360" ry="50"/>
    <ellipse cx="1480" cy="330" rx="260" ry="44"/>
    <ellipse cx="360" cy="150" rx="320" ry="56"/>
  </g>

  <!-- ============ THE ECLIPSE ============ -->
  <circle cx="1180" cy="168" r="470" fill="url(#dm-halo)"/>
  <circle cx="1180" cy="168" r="216" fill="url(#dm-orb)"/>
  <circle cx="1180" cy="168" r="216" fill="none" stroke="#ffb894" stroke-width="3" opacity="0.75"/>
  <circle cx="1180" cy="168" r="232" fill="none" stroke="#ff5a35" stroke-width="1.6" opacity="0.4"/>

  <!-- Red lightning clawing across the disc -->
  <g stroke="#ffd9c2" fill="none" stroke-width="2.4" stroke-linejoin="round" opacity="0.92">
    <path d="M1002 84 l30 40 -24 12 34 46 -18 8"/>
    <path d="M1372 118 l-30 36 26 14 -28 50"/>
    <path d="M1300 30 l20 32 -18 10 24 36"/>
  </g>
  <g stroke="#ff4a22" fill="none" stroke-width="9" opacity="0.3" filter="url(#dm-soft)">
    <path d="M1002 84 l30 40 -24 12 34 46"/>
    <path d="M1372 118 l-30 36 26 14 -28 50"/>
  </g>

  <!-- ============ CASTLE, in front of the disc ============ -->
  <g>
    <!-- outer small towers -->
    <g fill="url(#dm-keep)">
      <path d="M958 520 V266 l22-52 22 52 v254 Z"/>
      <path d="M1300 520 V254 l22-54 22 54 v266 Z"/>
    </g>
    <!-- flanking towers -->
    <g fill="url(#dm-keep)">
      <path d="M1004 520 V214 l30-76 30 76 v306 Z"/>
      <path d="M1244 520 V202 l30-80 30 80 v318 Z"/>
    </g>
    <!-- central keep + spire -->
    <path d="M1096 520 V150 l42-108 42 108 v370 Z" fill="url(#dm-keep)"/>
    <!-- cross atop -->
    <g fill="#2a1315">
      <rect x="1133" y="0" width="10" height="46"/>
      <rect x="1116" y="12" width="44" height="9"/>
    </g>
    <g stroke="#ff8b5e" stroke-width="1.7" opacity="0.75" fill="none">
      <path d="M1138 0 v46 M1116 16 h44"/>
    </g>

    <!-- main hall between towers -->
    <path d="M1064 520 V320 h180 v200 Z" fill="url(#dm-keep)"/>
    <!-- crenellations -->
    <g fill="url(#dm-keep)">
      <path d="M1064 330 h16 v-22 h18 v22 h18 v-22 h18 v22 h18 v-22 h18 v22 h18 v-22 h18 v22 h18 v-22 h18 v22 h2 v22 h-180 Z"/>
    </g>
    <!-- flying buttresses -->
    <g fill="none" stroke="#2a1315" stroke-width="12">
      <path d="M1032 430 Q 1052 372 1066 382"/>
      <path d="M1276 424 Q 1256 366 1242 376"/>
      <path d="M1032 494 Q 1054 440 1068 450"/>
      <path d="M1276 488 Q 1254 434 1240 444"/>
    </g>
    <!-- rose window -->
    <circle cx="1154" cy="392" r="34" fill="url(#dm-rose)" opacity="0.92"/>
    <g stroke="#2a1012" stroke-width="3.4" fill="none">
      <circle cx="1154" cy="392" r="34"/>
      <circle cx="1154" cy="392" r="14"/>
      <path d="M1154 358 v68 M1120 392 h68 M1130 368 l48 48 M1178 368 l-48 48"/>
    </g>
    <circle cx="1154" cy="392" r="50" fill="#ff6a36" opacity="0.18" filter="url(#dm-blur)"/>
    <!-- windows -->
    <g fill="#ff8b5e" opacity="0.75">
      <path d="M1082 452 a9 9 0 0 1 18 0 v32 h-18 Z"/>
      <path d="M1116 452 a9 9 0 0 1 18 0 v32 h-18 Z"/>
      <path d="M1174 452 a9 9 0 0 1 18 0 v32 h-18 Z"/>
      <path d="M1208 452 a9 9 0 0 1 18 0 v32 h-18 Z"/>
      <path d="M1024 300 a9 9 0 0 1 18 0 v28 h-18 Z"/>
      <path d="M1024 384 a9 9 0 0 1 18 0 v28 h-18 Z"/>
      <path d="M1266 288 a9 9 0 0 1 18 0 v28 h-18 Z"/>
      <path d="M1266 372 a9 9 0 0 1 18 0 v28 h-18 Z"/>
      <path d="M1130 246 a8 8 0 0 1 16 0 v26 h-16 Z"/>
      <path d="M970 360 a8 8 0 0 1 16 0 v24 h-16 Z"/>
      <path d="M1312 348 a8 8 0 0 1 16 0 v24 h-16 Z"/>
    </g>
    <!-- great door -->
    <path d="M1128 520 V450 a26 26 0 0 1 52 0 v70 Z" fill="#1a0c0d"/>
    <path d="M1128 520 V450 a26 26 0 0 1 52 0 v70 Z" fill="none" stroke="#ff7a52" stroke-width="1.7" opacity="0.5"/>
    <!-- backlit rim on every silhouette edge -->
    <g fill="none" stroke="#ff8355" stroke-width="2.2" opacity="0.68" stroke-linejoin="round">
      <path d="M1096 150 l42-108 42 108"/>
      <path d="M1004 214 l30-76 30 76"/>
      <path d="M1244 202 l30-80 30 80"/>
      <path d="M958 266 l22-52 22 52"/>
      <path d="M1300 254 l22-54 22 54"/>
      <path d="M1064 330 h16 v-22 h18 v22 h18 v-22 h18 v22 h18 v-22 h18 v22 h18 v-22 h18 v22 h18 v-22 h18 v22 h2"/>
    </g>
    <!-- ruined broken edge, right flank -->
    <path d="M1274 122 l12 28 -18 24 20 22 -14 32 h-4 V122 Z" fill="#0a0506"/>
  </g>

  <!-- ============ FLOATING ISLANDS ============ -->

  <!-- Castle island -->
  <g>
    <path fill="url(#dm-rock)" d="M918 512 L988 498 L1064 508 L1140 494 L1216 506 L1292 496 L1372 510
      L1350 558 L1362 600 L1306 618 L1290 672 L1240 650 L1216 714 L1168 664 L1128 706 L1086 654
      L1042 694 L1004 642 L964 666 L940 606 L914 556 Z"/>
    <g fill="#4a2422" opacity="0.5">
      <path d="M988 498 L1064 508 L1004 642 Z"/>
      <path d="M1216 506 L1292 496 L1240 650 Z"/>
    </g>
    <path fill="none" stroke="#ff7a52" stroke-width="1.8" opacity="0.42"
      d="M918 512 L988 498 L1064 508 L1140 494 L1216 506 L1292 496 L1372 510"/>
  </g>

  <!-- Centre island -->
  <g>
    <path fill="url(#dm-rock-dark)" d="M548 592 L628 576 L708 588 L790 572 L872 586 L936 576
      L918 626 L930 670 L878 690 L862 746 L812 724 L788 790 L740 738 L700 774 L658 720
      L616 756 L580 700 L552 644 Z"/>
    <g fill="#3a1c1b" opacity="0.45">
      <path d="M628 576 L708 588 L658 720 Z"/>
      <path d="M790 572 L872 586 L812 724 Z"/>
    </g>
    <path fill="none" stroke="#ff6a44" stroke-width="1.6" opacity="0.34"
      d="M548 592 L628 576 L708 588 L790 572 L872 586 L936 576"/>
  </g>

  <!-- Left island: carries the marker and the skulls -->
  <g>
    <path fill="url(#dm-rock)" d="M40 640 L118 624 L200 634 L282 620 L364 632 L446 622 L520 638
      L500 686 L512 728 L458 748 L440 804 L390 780 L358 842 L314 790 L276 818 L234 766
      L192 794 L152 740 L114 758 L82 704 L46 682 Z"/>
    <g fill="#4a2422" opacity="0.45">
      <path d="M118 624 L200 634 L152 740 Z"/>
      <path d="M364 632 L446 622 L390 780 Z"/>
    </g>
    <path fill="none" stroke="#ff7a52" stroke-width="1.8" opacity="0.4"
      d="M40 640 L118 624 L200 634 L282 620 L364 632 L446 622 L520 638"/>
  </g>

  <!-- Right pillar island -->
  <g>
    <path fill="url(#dm-rock-dark)" d="M1420 520 L1478 506 L1546 514 L1600 504 L1600 640
      L1580 660 L1566 714 L1524 688 L1500 744 L1462 692 L1430 720 L1408 656 Z"/>
    <path fill="none" stroke="#ff6a44" stroke-width="1.6" opacity="0.3"
      d="M1420 520 L1478 506 L1546 514 L1600 504"/>
  </g>

  <!-- Small drifting chunks -->
  <g fill="url(#dm-rock-dark)">
    <path d="M624 452 L668 442 L706 452 L692 480 L664 496 L636 478 Z"/>
    <path d="M842 470 L876 462 L900 472 L888 494 L862 502 L844 488 Z"/>
    <path d="M400 502 L436 494 L462 504 L448 526 L420 532 L404 518 Z"/>
    <path d="M1364 400 L1392 394 L1412 402 L1400 420 L1378 424 Z"/>
  </g>
  <g fill="none" stroke="#ff7a52" stroke-width="1.4" opacity="0.34">
    <path d="M624 452 L668 442 L706 452"/>
    <path d="M842 470 L876 462 L900 472"/>
    <path d="M400 502 L436 494 L462 504"/>
  </g>

  <!-- Debris trailing off the undersides -->
  <g fill="#3a1c1b" opacity="0.6">
    <circle cx="1120" cy="742" r="3"/><circle cx="1180" cy="768" r="2.2"/>
    <circle cx="1052" cy="726" r="2"/><circle cx="1264" cy="748" r="2.6"/>
    <circle cx="702" cy="810" r="2.6"/><circle cx="778" cy="828" r="2"/>
    <circle cx="640" cy="796" r="1.8"/>
    <circle cx="300" cy="866" r="2.4"/><circle cx="372" cy="876" r="1.8"/>
    <circle cx="196" cy="836" r="2"/>
  </g>

  <!-- ============ LEANING MARKER ============ -->
  <g>
    <!-- Angled backing board. Solid and dark, lit only on the edges facing
         the disc — outlining the whole shape made it read as glass. -->
    <path d="M96 168 L326 118 L372 250 L142 306 Z" fill="#150c0d"/>
    <g stroke="#000" stroke-width="1" opacity="0.5" fill="none">
      <path d="M120 176 L336 128 M132 214 L350 166 M140 254 L360 206"/>
    </g>
    <path d="M326 118 L372 250" fill="none" stroke="#c8705a" stroke-width="2.6" opacity="0.5"/>
    <path d="M96 168 L326 118" fill="none" stroke="#8a4a3c" stroke-width="1.6" opacity="0.35"/>

    <!-- shield board -->
    <path d="M392 176 L512 150 L556 232 L520 320 L406 296 Z" fill="#150c0d"/>
    <g stroke="#000" stroke-width="1" opacity="0.45" fill="none">
      <path d="M404 206 L530 180 M410 244 L542 218 M414 278 L528 256"/>
    </g>
    <path d="M512 150 L556 232 L520 320" fill="none" stroke="#c8705a" stroke-width="2.4" opacity="0.5"/>
    <path d="M436 250 L510 236 L494 262 L520 268 L432 286 Z" fill="#ff4a22" opacity="0.6"/>
    <!-- leaning post -->
    <path d="M244 660 L286 286 l38 5 -42 374 Z" fill="#150c0d"/>
    <!-- crossbar -->
    <path d="M186 356 l208 28 -6 40 -208-28 Z" fill="#150c0d"/>
    <!-- grain along the timber -->
    <g stroke="#000" stroke-width="1" opacity="0.5" fill="none">
      <path d="M256 656 L296 292 M270 658 L310 294"/>
      <path d="M188 370 l206 28 M190 384 l206 28"/>
    </g>
    <!-- warm edge on the disc side only -->
    <g fill="none" stroke="#c8705a" stroke-width="2.4" opacity="0.55">
      <path d="M324 291 L282 660"/>
      <path d="M394 384 l-6 40"/>
    </g>
    <g fill="none" stroke="#8a4a3c" stroke-width="1.4" opacity="0.32">
      <path d="M286 286 l38 5"/>
      <path d="M186 356 l208 28"/>
    </g>
    <!-- small nailed cross -->
    <g fill="#c8705a" opacity="0.6">
      <rect x="300" y="404" width="6" height="30"/>
      <rect x="289" y="412" width="28" height="6"/>
    </g>
  </g>

  <!-- Bone pile at the foot of the marker. Kept low-contrast and mostly
       silhouette: bright skulls with dark sockets read as cartoon faces. -->
  <g fill="#1c1213">
    <path d="M100 566 a30 30 0 0 1 56 14 q2 22 -14 26 q-18 4 -34 -6 q-12 -14 -8 -34 Z"/>
    <path d="M170 592 a24 24 0 0 1 45 11 q2 18 -12 21 q-15 3 -27 -5 q-9 -11 -6 -27 Z"/>
    <path d="M48 604 a22 22 0 0 1 41 10 q1 16 -11 19 q-13 3 -24 -5 q-8 -10 -6 -24 Z"/>
    <rect x="214" y="634" width="78" height="9" rx="4.5" transform="rotate(-8 214 634)"/>
    <rect x="194" y="668" width="62" height="8" rx="4" transform="rotate(6 194 668)"/>
    <rect x="150" y="652" width="54" height="7" rx="3.5" transform="rotate(-14 150 652)"/>
  </g>
  <!-- sockets: only slightly darker than the bone, never black holes -->
  <g fill="#100a0b">
    <ellipse cx="116" cy="580" rx="6" ry="7"/><ellipse cx="139" cy="583" rx="6" ry="7"/>
    <ellipse cx="182" cy="604" rx="5" ry="6"/><ellipse cx="200" cy="607" rx="5" ry="6"/>
    <ellipse cx="60" cy="616" rx="4.5" ry="5.5"/><ellipse cx="76" cy="618" rx="4.5" ry="5.5"/>
  </g>
  <!-- a single warm edge so they sit in the scene's light -->
  <g fill="none" stroke="#8a4a3c" stroke-width="1.4" opacity="0.45">
    <path d="M100 566 a30 30 0 0 1 56 14"/>
    <path d="M170 592 a24 24 0 0 1 45 11"/>
    <path d="M48 604 a22 22 0 0 1 41 10"/>
  </g>

  <!-- Ground lightning, mid-left, as in the thumbnail -->
  <g stroke="#ff3b1e" fill="none" stroke-width="2.6" stroke-linejoin="round" opacity="0.9">
    <path d="M612 520 l24 34 -20 10 28 40"/>
  </g>
  <g stroke="#ff3b1e" fill="none" stroke-width="10" opacity="0.28" filter="url(#dm-soft)">
    <path d="M612 520 l24 34 -20 10 28 40"/>
  </g>
  <ellipse cx="646" cy="606" rx="120" ry="16" fill="#ff3b1e" opacity="0.3" filter="url(#dm-blur)"/>

  <!-- Bats -->
  <g fill="#0a0506" opacity="0.94">
    <path d="M1058 118 q9-10 18 0 q9-10 18 0 q-9 8-18 3 q-9 5-18-3Z"/>
    <path d="M1284 96 q7-8 14 0 q7-8 14 0 q-7 6-14 2 q-7 4-14-2Z"/>
    <path d="M1330 226 q8-9 16 0 q8-9 16 0 q-8 7-16 3 q-8 4-16-3Z"/>
    <path d="M986 176 q6-7 12 0 q6-7 12 0 q-6 5-12 2 q-6 3-12-2Z"/>
    <path d="M1216 82 q5-6 10 0 q5-6 10 0 q-5 4-10 2 q-5 2-10-2Z"/>
    <path d="M1396 168 q6-7 12 0 q6-7 12 0 q-6 5-12 2 q-6 3-12-2Z"/>
  </g>

  <!-- Rising embers -->
  <g fill="#ff8b5e">
    <circle cx="470" cy="470" r="2.4" opacity="0.7"/>
    <circle cx="760" cy="420" r="1.7" opacity="0.5"/>
    <circle cx="906" cy="560" r="2.2" opacity="0.6"/>
    <circle cx="1424" cy="452" r="2" opacity="0.55"/>
    <circle cx="342" cy="560" r="1.8" opacity="0.5"/>
    <circle cx="1520" cy="620" r="2.4" opacity="0.6"/>
    <circle cx="676" cy="660" r="2" opacity="0.5"/>
    <circle cx="1032" cy="600" r="1.6" opacity="0.45"/>
    <circle cx="196" cy="452" r="2.1" opacity="0.5"/>
  </g>

  <rect width="1600" height="900" fill="url(#dm-vig)"/>
  <rect width="1600" height="900" filter="url(#dm-grain)" opacity="0.18"/>
</svg>
