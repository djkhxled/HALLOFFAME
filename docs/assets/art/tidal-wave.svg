<svg class="art art--tidalwave" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A breaking wave built from rows of glowing neon triangles over dark water, with diagonal light rails and diamond frames">
  <defs>
    <linearGradient id="tw-deep" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#04182b"/>
      <stop offset="46%" stop-color="#03101d"/>
      <stop offset="100%" stop-color="#03080f"/>
    </linearGradient>
    <linearGradient id="tw-tri" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0a5fae"/>
      <stop offset="34%" stop-color="#1fb4f5"/>
      <stop offset="78%" stop-color="#5ce4ff"/>
      <stop offset="100%" stop-color="#c9f6ff"/>
    </linearGradient>
    <filter id="tw-neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feFlood flood-color="#2ac9ff" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="tw-rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#74f0d6" stop-opacity="0"/>
      <stop offset="24%" stop-color="#74f0d6"/>
      <stop offset="72%" stop-color="#2ac9ff"/>
      <stop offset="100%" stop-color="#2ac9ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tw-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ac9ff" stop-opacity="0.44"/>
      <stop offset="58%" stop-color="#1173b8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1173b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tw-crest" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#d9fbff"/>
      <stop offset="70%" stop-color="#3fd2ff"/>
      <stop offset="100%" stop-color="#0a4f8c"/>
    </linearGradient>
    <linearGradient id="tw-vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03080f" stop-opacity="0.4"/>
      <stop offset="24%" stop-color="#03080f" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#03080f" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="tw-soft"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="tw-tight"><feGaussianBlur stdDeviation="3.4"/></filter>
    <filter id="tw-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- One glowing spike, the level's basic unit -->
    <g id="tw-spike">
      <path d="M0 -44 L26 30 L-26 30 Z" fill="url(#tw-tri)"/>
      <path d="M0 -44 L26 30 L-26 30 Z" fill="none" stroke="#ffffff" stroke-width="2.6"/>
      <path d="M0 -18 L9 12 L-9 12 Z" fill="#ffffff" opacity="0.8"/>
    </g>
    <!-- A layered chevron block, as the level stacks them -->
    <g id="tw-chev">
      <path d="M-70 34 L0 -34 L70 34" fill="none" stroke="#2ac9ff" stroke-width="9"/>
      <path d="M-70 62 L0 -6 L70 62" fill="none" stroke="#2ac9ff" stroke-width="6" opacity="0.7"/>
      <path d="M-70 86 L0 18 L70 86" fill="none" stroke="#74f0d6" stroke-width="4" opacity="0.5"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#tw-deep)"/>
  <ellipse cx="1060" cy="440" rx="780" ry="480" fill="url(#tw-glow)"/>

  <!-- Diagonal light rails, the level's travel lines -->
  <g>
    <rect x="-140" y="700" width="1100" height="16" rx="8" fill="url(#tw-rail)"
          transform="rotate(-34 400 708)" opacity="0.9"/>
    <rect x="-140" y="700" width="1100" height="42" rx="21" fill="#2ac9ff"
          transform="rotate(-34 400 708)" opacity="0.18" filter="url(#tw-soft)"/>
    <rect x="620" y="300" width="1160" height="12" rx="6" fill="url(#tw-rail)"
          transform="rotate(-34 1200 306)" opacity="0.7"/>
    <rect x="120" y="880" width="900" height="10" rx="5" fill="url(#tw-rail)"
          transform="rotate(-34 570 885)" opacity="0.5"/>
  </g>

  <!-- Diamond frames -->
  <g fill="none" opacity="0.6">
    <g transform="translate(216 234) rotate(45)">
      <rect x="-64" y="-64" width="128" height="128" stroke="#2ac9ff" stroke-width="5"/>
      <rect x="-46" y="-46" width="92" height="92" stroke="#74f0d6" stroke-width="3"/>
      <rect x="-28" y="-28" width="56" height="56" stroke="#eafdff" stroke-width="2"/>
    </g>
    <g transform="translate(1436 258) rotate(45)" opacity="0.75">
      <rect x="-56" y="-56" width="112" height="112" stroke="#2ac9ff" stroke-width="4.4"/>
      <rect x="-38" y="-38" width="76" height="76" stroke="#74f0d6" stroke-width="2.8"/>
    </g>
    <g transform="translate(120 660) rotate(45)" opacity="0.5">
      <rect x="-44" y="-44" width="88" height="88" stroke="#2ac9ff" stroke-width="3.6"/>
      <rect x="-28" y="-28" width="56" height="56" stroke="#eafdff" stroke-width="2"/>
    </g>
  </g>

  <!-- Chevron stacks -->
  <g opacity="0.8">
    <use href="#tw-chev" x="420" y="760"/>
    <use href="#tw-chev" x="700" y="820" transform="scale(0.8) translate(180 190)"/>
    <use href="#tw-chev" x="1290" y="742"/>
  </g>

  <!-- ============ THE WAVE, BUILT FROM SPIKES ============ -->
  <!-- The crest curve is described by rows of the level's own triangles,
       tightening as the wave rears up on the right. -->
  <g>
    <!-- glow behind the wall of water -->
    <path d="M760 900 C 720 620, 840 300, 1120 190 C 1320 110, 1600 130, 1600 130 L1600 900 Z"
          fill="#062a4c" opacity="0.55"/>
    <path d="M900 900 C 872 650, 968 372, 1210 268 C 1380 196, 1600 214, 1600 214 L1600 900 Z"
          fill="#083a68" opacity="0.5"/>

    <!-- breaking lip -->
    <path fill="url(#tw-crest)" d="M1110 214
      C 1250 146, 1450 152, 1600 180 L1600 100
      C 1420 72, 1220 96, 1104 182 C 1046 226, 1010 292, 992 356
      C 1026 296, 1054 250, 1110 214 Z"/>
    <g fill="#ffffff">
      <path d="M1104 200
        a34 34 0 0 1 60 -18 a38 38 0 0 1 68 -12 a34 34 0 0 1 62 -8
        a38 38 0 0 1 70 -6 a33 33 0 0 1 60 -2 a35 35 0 0 1 62 2
        a30 30 0 0 1 54 6 L1600 176 L1600 96
        C 1420 72, 1220 96, 1104 182 Z"/>
    </g>

    <!-- spike rows following the wave face -->
    <g filter="url(#tw-neon)">
      <use href="#tw-spike" transform="translate(1006 402) rotate(-64) scale(1.05)"/>
      <use href="#tw-spike" transform="translate(1044 486) rotate(-58) scale(1.05)"/>
      <use href="#tw-spike" transform="translate(1090 570) rotate(-52) scale(1.05)"/>
      <use href="#tw-spike" transform="translate(1146 650) rotate(-46) scale(1.05)"/>
      <use href="#tw-spike" transform="translate(1210 726) rotate(-40) scale(1.05)"/>
      <use href="#tw-spike" transform="translate(1282 796) rotate(-34) scale(1.05)"/>

      <use href="#tw-spike" transform="translate(1122 372) rotate(-70) scale(0.9)" opacity="0.9"/>
      <use href="#tw-spike" transform="translate(1164 456) rotate(-64) scale(0.9)" opacity="0.9"/>
      <use href="#tw-spike" transform="translate(1214 540) rotate(-58) scale(0.9)" opacity="0.9"/>
      <use href="#tw-spike" transform="translate(1272 620) rotate(-52) scale(0.9)" opacity="0.9"/>
      <use href="#tw-spike" transform="translate(1338 696) rotate(-46) scale(0.9)" opacity="0.9"/>

      <use href="#tw-spike" transform="translate(1252 344) rotate(-76) scale(0.75)" opacity="0.75"/>
      <use href="#tw-spike" transform="translate(1296 424) rotate(-70) scale(0.75)" opacity="0.75"/>
      <use href="#tw-spike" transform="translate(1348 502) rotate(-64) scale(0.75)" opacity="0.75"/>
      <use href="#tw-spike" transform="translate(1408 578) rotate(-58) scale(0.75)" opacity="0.75"/>

      <use href="#tw-spike" transform="translate(1420 340) rotate(-82) scale(0.62)" opacity="0.6"/>
      <use href="#tw-spike" transform="translate(1464 414) rotate(-76) scale(0.62)" opacity="0.6"/>
      <use href="#tw-spike" transform="translate(1516 488) rotate(-70) scale(0.62)" opacity="0.6"/>
    </g>

    <!-- inner barrel light -->
    <ellipse cx="1330" cy="420" rx="180" ry="230" fill="#2ac9ff" opacity="0.2" filter="url(#tw-soft)"/>

    <!-- spray off the lip -->
    <g fill="#d9fbff">
      <circle cx="1224" cy="98" r="5" opacity="0.9"/><circle cx="1300" cy="72" r="4" opacity="0.8"/>
      <circle cx="1372" cy="90" r="4.6" opacity="0.85"/><circle cx="1444" cy="60" r="3.4" opacity="0.7"/>
      <circle cx="1520" cy="84" r="4" opacity="0.75"/><circle cx="1262" cy="44" r="3" opacity="0.6"/>
      <circle cx="1340" cy="32" r="3.6" opacity="0.65"/><circle cx="1414" cy="20" r="2.8" opacity="0.55"/>
    </g>
  </g>

  <!-- Free-floating spikes in the water -->
  <g filter="url(#tw-neon)">
    <use href="#tw-spike" transform="translate(206 400) rotate(-28) scale(1.15)" opacity="0.85"/>
    <use href="#tw-spike" transform="translate(378 300) rotate(16) scale(0.85)" opacity="0.7"/>
    <use href="#tw-spike" transform="translate(150 550) rotate(38) scale(0.95)" opacity="0.7"/>
    <use href="#tw-spike" transform="translate(560 470) rotate(-14) scale(0.7)" opacity="0.55"/>
    <use href="#tw-spike" transform="translate(690 250) rotate(24) scale(0.6)" opacity="0.45"/>
    <use href="#tw-spike" transform="translate(760 620) rotate(-40) scale(0.8)" opacity="0.5"/>
    <use href="#tw-spike" transform="translate(330 740) rotate(8) scale(0.7)" opacity="0.45"/>
  </g>

  <!-- Caustic ripples -->
  <g stroke="#2ac9ff" fill="none" opacity="0.18">
    <path d="M-40 660 q 90 -30 180 0 t 180 0 t 180 0 t 180 0 t 180 0 t 180 0 t 180 0" stroke-width="2"/>
    <path d="M-40 720 q 110 -34 220 0 t 220 0 t 220 0 t 220 0 t 220 0 t 220 0" stroke-width="1.6"/>
    <path d="M-40 786 q 80 -26 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0" stroke-width="2.2"/>
    <path d="M-40 850 q 120 -36 240 0 t 240 0 t 240 0 t 240 0 t 240 0 t 240 0" stroke-width="1.4"/>
  </g>

  <!-- Bubbles -->
  <g fill="#74f0d6">
    <circle cx="300" cy="470" r="3.4" opacity="0.75"/><circle cx="356" cy="552" r="2.2" opacity="0.55"/>
    <circle cx="214" cy="500" r="2.6" opacity="0.6"/><circle cx="540" cy="600" r="3" opacity="0.6"/>
    <circle cx="470" cy="340" r="2" opacity="0.5"/><circle cx="700" cy="510" r="2.8" opacity="0.55"/>
    <circle cx="640" cy="690" r="2.2" opacity="0.5"/><circle cx="880" cy="400" r="2.4" opacity="0.45"/>
    <circle cx="960" cy="640" r="2.6" opacity="0.5"/>
  </g>

  <rect width="1600" height="900" fill="url(#tw-vig)"/>
  <rect width="1600" height="900" filter="url(#tw-grain)" opacity="0.12"/>
</svg>
