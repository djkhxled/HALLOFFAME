<section class="hero page" data-motion>
  <p class="hero__eyebrow">{{ eyebrow }}</p>
  <div class="hero__art" aria-hidden="true">{{ art_html }}</div>
  <h1 class="hero__title">{{ title_line_html }}</h1>
  <div class="hero__foot">
    <p>{{ meta_left }}</p>
    <p class="hero__lede">{{ lede }}</p>
    <p class="hero__meta-r">{{ meta_right }}</p>
    <div class="hero__rule"></div>
  </div>
</section>

<section class="section page" aria-labelledby="countdown-h">
  <h2 id="countdown-h" class="eyebrow">The countdown &mdash; {{ total }} to 1</h2>
  {{ countdown_html }}
</section>

<section class="section page" aria-labelledby="numbers-h">
  <h2 id="numbers-h" class="eyebrow">The list, by the numbers</h2>
  {{ numbers_html }}
</section>

<section class="section page" aria-labelledby="colophon-h">
  <h2 id="colophon-h" class="eyebrow">About this list</h2>
  <div class="measure">{{ about_html }}</div>
</section>
